<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concierge Brasil 🇧🇷</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root{
  --bg:#fdfaf2; --card:#ffffff; --text:#1f2937; --soft:#6b7280;
  --primary:#0f9d70; --primary-d:#0b7a57; --accent:#f4b942; --border:#e8dfc7;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1f1a; --card:#123328; --text:#f2ede0; --soft:#a9beb3; --border:#1f4a3b; --primary:#34d399; --primary-d:#10b981; }
}
:root[data-theme="dark"]{ --bg:#0b1f1a; --card:#123328; --text:#f2ede0; --soft:#a9beb3; --border:#1f4a3b; --primary:#34d399; --primary-d:#10b981; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
body{ background:var(--bg); color:var(--text); margin:0; height:100%; font-family:ui-sans-serif,system-ui,-apple-system,sans-serif; }
.card{ background:var(--card); border:1px solid var(--border); border-radius:1rem; }
.softtxt{ color:var(--soft); }
.brand{ color:var(--primary); }
.brand-bg{ background:var(--primary); }
.scrollx{ overflow-x:auto; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useRef,useEffect} = React;

const TRAVELERS = ["Fabiana","Daría","Antonio","Alberth"];

const DAYS = [
 {n:1,date:"13/10 · Lun",phase:"Búzios",zone:"Llegada",m:"Vuelo de llegada a Río (GIG/SDU). Retiro de auto de alquiler en el aeropuerto.",a:"Manejo Río → Búzios (~2h30, RJ-106 / ViaLagos). Parada opcional en Araruama.",n:"Check-in en Búzios. Primera caminata por Rua das Pedras.",r:"Marisquería frente al mar en Rua das Pedras"},
 {n:2,date:"14/10 · Mar",phase:"Búzios",zone:"Playas Norte",m:"Playa Geribá — la más animada, ideal para surf y kioscos.",a:"Playa Ferradura — aguas calmas, perfecta para nadar.",n:"Cena y bares en Rua das Pedras.",r:"Restaurante de pescados con vista a Ferradura"},
 {n:3,date:"15/10 · Mié",phase:"Búzios",zone:"Playas Centro",m:"Playa João Fernandes — snorkel y mirador natural.",a:"Tiempo libre / compras en el centro. Armar equipaje para el regreso.",n:"Cena de despedida de Búzios en Rua das Pedras.",r:"Cena especial de despedida — reservar con antelación"},
 {n:4,date:"16/10 · Jue",phase:"Traslado",zone:"Búzios → Río",m:"Manejo Búzios → Río temprano. Devolución del auto de alquiler.",a:"Check-in en Río. Primer paseo por Ipanema.",n:"Cena en Ipanema y atardecer en el mirador de Arpoador.",r:"Bistró casual en Ipanema"},
 {n:5,date:"17/10 · Vie",phase:"Río",zone:"Zona Sul · Playas",m:"Playa de Ipanema (Posto 9).",a:"Playa de Copacabana, paseo por el malecón.",n:"Cena y música en vivo en Copacabana.",r:"Churrascaria en Copacabana"},
 {n:6,date:"18/10 · Sáb",phase:"Río",zone:"Iconos · Cristo & Pão de Açúcar",m:"Cristo Redentor vía van oficial Paineiras Corcovado (reservar con antelación).",a:"Pão de Açúcar — teleférico hasta Morro da Urca y cima, ideal al atardecer.",n:"Cena en Urca o Botafogo.",r:"Bar con vista en Urca"},
 {n:7,date:"19/10 · Dom",phase:"Río",zone:"Centro · Lapa",m:"Escadaria Selarón.",a:"Centro histórico y Arcos da Lapa.",n:"Vida nocturna en Lapa: samba en vivo.",r:"Rio Scenarium o botequim en Lapa"},
 {n:8,date:"20/10 · Lun",phase:"Río",zone:"Naturaleza",m:"Parque Lage — jardines y café en la mansión.",a:"Jardín Botánico o caminata en la Floresta da Tijuca.",n:"Cena en Jardim Botânico / Leblon.",r:"Café-restaurante dentro del Parque Lage"},
 {n:9,date:"21/10 · Mar",phase:"Río",zone:"Libre · Compras",m:"Mañana libre: compras en Leblon o feria local.",a:"Tarde de playa relajada, últimos recuerdos.",n:"Cena especial de cierre de viaje.",r:"Elegir el restaurante favorito del grupo"},
 {n:10,date:"22/10 · Mié",phase:"Río",zone:"Regreso",m:"Últimos paseos o compras de último momento.",a:"Traslado al aeropuerto (Uber). Vuelo de regreso.",n:"—",r:""},
];

const SYSTEM_PROMPT = `Eres el Concierge de viaje del grupo (Fabiana, Daría, Antonio, Alberth) para su viaje a Brasil del 13/10 al 22/10.
Fase 1 (13-15/10): Búzios. Llegan a Río, retiran auto de alquiler, manejan a Búzios. Playas: Geribá, Ferradura, João Fernandes. Se hospedan cerca de Rua das Pedras.
Fase 2 (16-22/10): Río de Janeiro. Devuelven el auto el 16/10 temprano y se mueven en Uber/Metro. Visitan Cristo Redentor, Pão de Açúcar, Ipanema, Copacabana, Escadaria Selarón, Parque Lage, Lapa.
Responde siempre en español, de forma breve, cálida y práctica, como un guía local experto. Si preguntan por lluvia, sugiere alternativas bajo techo cercanas al plan de ese día (museos, Parque Lage, shoppings, Confeitaria Colombo). Si preguntan por cambios de ruta, respeta la lógica de zonas para no desperdiciar tiempo en Uber. Si no sabes un dato exacto (precio, horario), acláralo y sugiere confirmar en el lugar.`;

function DayCard({d}){
  return (
    <div className="card p-4 mb-3">
      <div className="flex items-center justify-between mb-2">
        <div className="flex items-center gap-2">
          <span className="brand-bg text-white text-xs font-bold rounded-full w-7 h-7 flex items-center justify-center">{d.n}</span>
          <div>
            <p className="font-semibold text-sm">{d.date}</p>
            <p className="text-xs softtxt">{d.phase} · {d.zone}</p>
          </div>
        </div>
        <span className="text-xl">{d.phase==="Búzios"?"🏖️":d.phase==="Traslado"?"🚗":"🌆"}</span>
      </div>
      <div className="space-y-2 text-sm">
        <p><b className="brand">☀️ Mañana</b> — {d.m}</p>
        <p><b className="brand">🌇 Tarde</b> — {d.a}</p>
        <p><b className="brand">🌙 Noche</b> — {d.n}</p>
      </div>
      {d.r && <p className="mt-3 text-xs bg-amber-50 dark:bg-transparent border border-dashed border-amber-300 rounded-lg px-3 py-2 softtxt">🍽️ {d.r}</p>}
    </div>
  );
}

function Itinerary(){
  return (
    <div className="p-4 pb-24">
      <h2 className="text-lg font-bold mb-1">Itinerario · 10 días</h2>
      <p className="text-sm softtxt mb-4">{TRAVELERS.join(" · ")}</p>
      {DAYS.map(d=><DayCard key={d.n} d={d}/>)}
    </div>
  );
}

function Logistics(){
  return (
    <div className="p-4 pb-24 space-y-6">
      <h2 className="text-lg font-bold">Logística y Presupuesto</h2>

      <div className="card p-4">
        <p className="font-semibold mb-2">🎟️ Costos estimados — atracciones</p>
        <div className="scrollx">
        <table className="w-full text-sm min-w-[420px]">
          <thead><tr className="text-left softtxt border-b" style={{borderColor:"var(--border)"}}>
            <th className="py-1">Atracción</th><th>BRL</th><th>USD aprox.</th></tr></thead>
          <tbody>
            <tr className="border-b" style={{borderColor:"var(--border)"}}>
              <td className="py-2">Cristo Redentor (van Paineiras + entrada)</td><td>R$ 99–135</td><td>US$ 18–25</td>
            </tr>
            <tr><td className="py-2">Pão de Açúcar (bondinho ida y vuelta)</td><td>R$ 150–190</td><td>US$ 27–35</td></tr>
          </tbody>
        </table>
        </div>
        <p className="text-xs softtxt mt-2">*Estimado a ~R$5.5/US$. Comprar con antelación, horarios pico se agotan.</p>
      </div>

      <div className="card p-4">
        <p className="font-semibold mb-2">🔗 Enlaces oficiales</p>
        <ul className="text-sm space-y-1">
          <li>Paineiras Corcovado (Cristo Redentor): <span className="brand break-all">www.paineirascorcovado.com.br</span></li>
          <li>Bondinho Pão de Açúcar: <span className="brand break-all">www.bondinho.com.br</span></li>
        </ul>
      </div>

      <div className="card p-4">
        <p className="font-semibold mb-2">🛣️ Peaje y combustible Río ⇄ Búzios (SUV/Sedán)</p>
        <ul className="text-sm space-y-1 softtxt">
          <li>Distancia: ~170 km por trayecto (340 km ida y vuelta)</li>
          <li>Peaje ViaLagos: ~R$35 por trayecto → ~R$70 ida y vuelta</li>
          <li>Combustible: ~34L × R$6.00/L ≈ R$204 total</li>
          <li className="font-semibold text-[var(--text)]">Total estimado: ~R$274 (÷4 personas ≈ R$69 c/u)</li>
        </ul>
      </div>

      <div className="card p-4">
        <p className="font-semibold mb-3">🚙 Renta de autos</p>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 text-sm">
          {[["Rentcars","www.rentcars.com"],["Localiza","www.localiza.com"],["Movida","www.movida.com.br"]].map(([n,u])=>(
            <div key={n} className="border rounded-lg p-3 text-center" style={{borderColor:"var(--border)"}}>
              <p className="font-semibold">{n}</p><p className="softtxt text-xs break-all">{u}</p>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function Bubble({role,text}){
  const isUser = role==="user";
  return (
    <div className={"flex "+(isUser?"justify-end":"justify-start")+" mb-2"}>
      <div className={"max-w-[80%] rounded-2xl px-3 py-2 text-sm "+(isUser?"brand-bg text-white rounded-br-sm":"card rounded-bl-sm")}>
        {text}
      </div>
    </div>
  );
}

function loadCfg(){
  try{ return JSON.parse(localStorage.getItem("concierge_cfg")) || {provider:"openai",apiKey:"",model:""}; }
  catch(e){ return {provider:"openai",apiKey:"",model:""}; }
}

async function callOpenAI(cfg, messages){
  const r = await fetch("https://api.openai.com/v1/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.apiKey},
    body: JSON.stringify({ model: cfg.model || "gpt-4o-mini", messages })
  });
  const d = await r.json();
  if(d.error) throw new Error(d.error.message);
  return d.choices[0].message.content.trim();
}

async function callGemini(cfg, promptText){
  const model = cfg.model || "gemini-2.0-flash";
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cfg.apiKey}`,{
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ contents:[{parts:[{text:promptText}]}] })
  });
  const d = await r.json();
  if(d.error) throw new Error(d.error.message);
  return d.candidates[0].content.parts[0].text.trim();
}

function SettingsForm({cfg,onSave,onClose}){
  const [provider,setProvider] = useState(cfg.provider||"openai");
  const [apiKey,setApiKey] = useState(cfg.apiKey||"");
  const [model,setModel] = useState(cfg.model||"");
  return (
    <div className="flex-1 p-4 overflow-y-auto text-sm space-y-3">
      <p className="softtxt">Elige tu proveedor de IA e ingresa tu propia API key. Se guarda solo en este navegador (localStorage), nunca en el código del repositorio.</p>
      <div>
        <label className="block text-xs softtxt mb-1">Proveedor</label>
        <select value={provider} onChange={e=>setProvider(e.target.value)} className="w-full border rounded-lg px-3 py-2 bg-transparent" style={{borderColor:"var(--border)"}}>
          <option value="openai">OpenAI (GPT)</option>
          <option value="gemini">Google Gemini</option>
        </select>
      </div>
      <div>
        <label className="block text-xs softtxt mb-1">API Key</label>
        <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="sk-... / AIza..."
          className="w-full border rounded-lg px-3 py-2 bg-transparent" style={{borderColor:"var(--border)"}}/>
      </div>
      <div>
        <label className="block text-xs softtxt mb-1">Modelo (opcional)</label>
        <input value={model} onChange={e=>setModel(e.target.value)} placeholder={provider==="openai"?"gpt-4o-mini":"gemini-2.0-flash"}
          className="w-full border rounded-lg px-3 py-2 bg-transparent" style={{borderColor:"var(--border)"}}/>
      </div>
      <div className="flex gap-2 pt-2">
        <button onClick={()=>{onSave({provider,apiKey,model}); onClose();}} className="brand-bg text-white rounded-lg px-4 py-2 font-semibold">Guardar</button>
        <button onClick={onClose} className="border rounded-lg px-4 py-2" style={{borderColor:"var(--border)"}}>Cancelar</button>
      </div>
    </div>
  );
}

function Concierge({open,onClose}){
  const [msgs,setMsgs] = useState([{role:"bot",text:"¡Hola! Soy el Concierge del viaje 🌴 Preguntame sobre horarios, playas, restaurantes o qué hacer si llueve."}]);
  const [input,setInput] = useState("");
  const [loading,setLoading] = useState(false);
  const [showSettings,setShowSettings] = useState(false);
  const [cfg,setCfg] = useState(loadCfg);
  const endRef = useRef(null);
  useEffect(()=>{ endRef.current && endRef.current.scrollIntoView({behavior:"smooth"}); },[msgs,open]);

  function saveCfg(newCfg){
    setCfg(newCfg);
    try{ localStorage.setItem("concierge_cfg", JSON.stringify(newCfg)); }catch(e){}
  }

  // Funciona en cualquier hosting estático (GitHub Pages incluido): llama directo a OpenAI o Gemini
  // usando la API key que cada usuario configura con el ícono ⚙️. Ideal para un grupo chico y de confianza,
  // ya que la key viaja desde el navegador de quien la configuró — evita compartir el link públicamente.
  async function askConcierge(userText, history, cfg){
    if(!cfg.apiKey){
      return "⚙️ Todavía no configuraste una API key. Toca el ícono ⚙️ arriba y pega tu key de OpenAI o Gemini para activar el Concierge IA.";
    }
    try{
      if(cfg.provider === "gemini"){
        const convo = history.slice(-6).map(m=>`${m.role==="user"?"Usuario":"Concierge"}: ${m.text}`).join("\n");
        const promptText = SYSTEM_PROMPT+"\n\n"+convo+`\nUsuario: ${userText}\nConcierge:`;
        return await callGemini(cfg, promptText);
      } else {
        const messages = [
          {role:"system", content:SYSTEM_PROMPT},
          ...history.slice(-6).map(m=>({role: m.role==="user"?"user":"assistant", content:m.text})),
          {role:"user", content:userText}
        ];
        return await callOpenAI(cfg, messages);
      }
    }catch(e){
      return "⚠️ No pude conectar con la IA ("+e.message+"). Revisá tu API key o el modelo en ⚙️.";
    }
  }

  async function handleSend(){
    const text = input.trim();
    if(!text || loading) return;
    const next = [...msgs,{role:"user",text}];
    setMsgs(next); setInput(""); setLoading(true);
    const reply = await askConcierge(text,next,cfg);
    setMsgs(m=>[...m,{role:"bot",text:reply}]);
    setLoading(false);
  }

  if(!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center sm:justify-center bg-black/40" onClick={onClose}>
      <div className="card w-full sm:w-[420px] sm:rounded-2xl rounded-t-2xl h-[80vh] sm:h-[560px] flex flex-col" onClick={e=>e.stopPropagation()} style={{paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        <div className="flex items-center justify-between p-4 border-b" style={{borderColor:"var(--border)"}}>
          <p className="font-bold">🌴 Concierge IA del viaje</p>
          <div className="flex items-center gap-3">
            <button onClick={()=>setShowSettings(s=>!s)} className="softtxt text-lg leading-none" title="Configurar API key">⚙️</button>
            <button onClick={onClose} className="softtxt text-xl leading-none">✕</button>
          </div>
        </div>
        {showSettings ? (
          <SettingsForm cfg={cfg} onSave={saveCfg} onClose={()=>setShowSettings(false)}/>
        ) : (
          <React.Fragment>
            <div className="flex-1 overflow-y-auto p-4">
              {msgs.map((m,i)=><Bubble key={i} role={m.role} text={m.text}/>)}
              {loading && <Bubble role="bot" text="Escribiendo…"/>}
              <div ref={endRef}/>
            </div>
            <div className="p-3 border-t flex gap-2" style={{borderColor:"var(--border)"}}>
              <input value={input} onChange={e=>setInput(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&handleSend()}
                placeholder="Ej: ¿Qué hacemos si llueve el día del Cristo?"
                className="flex-1 rounded-full px-4 py-2 text-sm border outline-none bg-transparent"
                style={{borderColor:"var(--border)"}}/>
              <button onClick={handleSend} className="brand-bg text-white rounded-full w-10 h-10 flex items-center justify-center shrink-0">➤</button>
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function App(){
  const [tab,setTab] = useState("itin");
  const [chatOpen,setChatOpen] = useState(false);
  return (
    <div className="min-h-screen max-w-2xl mx-auto relative">
      <header className="brand-bg text-white p-4 pb-6 rounded-b-3xl">
        <p className="text-xs opacity-80">Concierge Digital de Viaje</p>
        <h1 className="text-xl font-bold">🇧🇷 Brasil · 13–22 Oct</h1>
        <p className="text-xs opacity-90 mt-1">Fabiana · Daría · Antonio · Alberth</p>
      </header>

      {tab==="itin" ? <Itinerary/> : <Logistics/>}

      <button onClick={()=>setChatOpen(true)}
        className="fixed right-4 brand-bg text-white rounded-full w-14 h-14 shadow-lg text-2xl flex items-center justify-center z-40"
        style={{bottom:"calc(5rem + env(safe-area-inset-bottom,0px))"}}>💬</button>

      <nav className="fixed bottom-0 left-0 right-0 card flex justify-around py-2 max-w-2xl mx-auto"
        style={{paddingBottom:"calc(0.5rem + env(safe-area-inset-bottom,0px))"}}>
        <button onClick={()=>setTab("itin")} className={"flex flex-col items-center text-xs px-4 "+(tab==="itin"?"brand font-bold":"softtxt")}>
          <span className="text-lg">🗺️</span>Itinerario
        </button>
        <button onClick={()=>setTab("log")} className={"flex flex-col items-center text-xs px-4 "+(tab==="log"?"brand font-bold":"softtxt")}>
          <span className="text-lg">💰</span>Logística
        </button>
      </nav>

      <Concierge open={chatOpen} onClose={()=>setChatOpen(false)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
